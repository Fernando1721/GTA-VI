<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>GTA VI</title>
  </head>
  <body>
    <p class="nome">Lucia</p>
    <img src="img/lucia.png" alt="" class="personagem" />

    <div class="textos">
      <p class="etiqueta">Selecione seu personagem</p>
      <h1>
        Não é só <br />
        um jogo
      </h1>
      <p class="texto-apoio">
        Esolha uma lenda de Dev City. Ou tire uma selfie e vire uma.
      </p>
    </div>

    <div class="menu">
      <img onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#ff3aca')" src="img/lucia.png" class="avatar" >

      <img onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')" src="img/jason.png" class="avatar">

      <img onclick="escolherPersonagem('CJ', 'img/cj.png', '#7ed37e')" src="img/cj.png" class="avatar">

      <label class="voce">📸
        <input type="file" accept="image/*" hidden onchange="lerFoto(this)">
      </label>

    </div>
  </body>

  <script src=" https://js.puter.com/v2/ "></script>
  <script src="scripts.js"></script>
  
</html>
